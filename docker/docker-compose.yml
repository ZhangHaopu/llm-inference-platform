services:
  vllm:
    image: vllm/vllm-openai:latest
    command:
      - "--model"
      - "${VLLM_MODEL:-TheBloke/Mistral-7B-Instruct-v0.1-AWQ}"
      - "--quantization"
      - "${VLLM_QUANTIZATION:-awq}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--max-model-len"
      - "4096"
      - "--gpu-memory-utilization"
      - "0.90"
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  gateway:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      VLLM_URL: "${VLLM_URL:-http://vllm:8000}"
      API_KEYS: "${API_KEYS:?set API_KEYS before starting}"
      MAX_CONCURRENT_REQUESTS: "${MAX_CONCURRENT_REQUESTS:-10}"
      QUEUE_TIMEOUT_SECONDS: "${QUEUE_TIMEOUT_SECONDS:-30}"
    ports:
      - "8080:8080"
    depends_on:
      - vllm

  prometheus:
    image: prom/prometheus:latest
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - gateway

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  hf-cache:
